name: Build AsrRecognize

on:
  workflow_dispatch:
    inputs:
      include_model:
        description: "Device IPA 是否下载并打包约 0.9GB 的 Qwen3 模型"
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  simulator-app:
    name: Simulator app for Appetize
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          LATEST=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST"; fi
          xcodebuild -version
          uname -m

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-26-${{ hashFiles('AsrRecognize.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-26-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AsrRecognize.xcodeproj \
            -scheme AsrRecognize

      - name: Build arm64 simulator app
        run: |
          xcodebuild \
            -project AsrRecognize.xcodeproj \
            -scheme AsrRecognize \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SimulatorBuild" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .app for Appetize
        run: |
          APP="$RUNNER_TEMP/SimulatorBuild/Build/Products/Debug-iphonesimulator/AsrRecognize.app"
          if [ ! -d "$APP" ]; then
            echo "App bundle not found: $APP"
            exit 1
          fi
          du -sh "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "AsrRecognize-simulator.zip"

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsrRecognize-simulator-appetize
          path: AsrRecognize-simulator.zip
          if-no-files-found: error
          retention-days: 14

  offline-ipa:
    name: Unsigned IPA with Qwen3 model
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          LATEST=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST"; fi
          xcodebuild -version
          uname -m

      - name: Install Hugging Face CLI
        run: |
          python3 -m venv "$RUNNER_TEMP/hf"
          "$RUNNER_TEMP/hf/bin/pip" install -U huggingface_hub
          echo "$RUNNER_TEMP/hf/bin" >> "$GITHUB_PATH"

      - name: Prepare Qwen3 CoreML model
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_model }}
        run: |
          bash tools/prepare-model.sh AsrRecognize/Resources/Qwen3ASR
          find AsrRecognize/Resources/Qwen3ASR -maxdepth 1 -mindepth 1 -print

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-26-${{ hashFiles('AsrRecognize.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-26-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AsrRecognize.xcodeproj \
            -scheme AsrRecognize

      - name: Build device app without signing
        run: |
          xcodebuild \
            -project AsrRecognize.xcodeproj \
            -scheme AsrRecognize \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DeviceBuild" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/DeviceBuild/Build/Products/Release-iphoneos/AsrRecognize.app"
          if [ ! -d "$APP" ]; then
            echo "App bundle not found: $APP"
            exit 1
          fi
          du -sh "$APP"
          rm -rf Payload AsrRecognize-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry AsrRecognize-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AsrRecognize-unsigned-ipa
          path: AsrRecognize-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
